name: ci-base-image

on:
    push:
        branches:
            - main
            - dev
        paths:
            - docker/build/ci.Dockerfile
            - docs/package.json
            - tests/playwright/package.json
            - tests/playwright/package-lock.json
    pull_request:
        paths:
            - docker/build/ci.Dockerfile
            - docs/package.json
            - tests/playwright/package.json
            - tests/playwright/package-lock.json
    workflow_dispatch:

env:
    HARBOR_HOST: ${{ vars.HARBOR_HOST || env.HARBOR_HOST }}
    LOCAL_SHA: ${{ forge.sha || env.FORGEJO_SHA || env.LOCAL_SHA }}
    MISE_TASK_OUTPUT: interleave
    MISE_YES: "true"
    NO_COLOR: "1"

jobs:
    build-ci-base-image:
        runs-on: cocaine
        container:
            image: ghcr.io/catthehacker/ubuntu:act-latest
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: https://data.forgejo.org/actions/checkout@v4

            - name: Prepare Docker auth
              shell: bash
              run: |
                  set -euo pipefail
                  . ./scripts/ci/prepare-docker-auth.sh

            - name: Build CI image for pull request
              if: ${{ forge.event_name == 'pull_request' }}
              shell: bash
              run: |
                  set -euo pipefail
                  docker buildx build \
                    --pull \
                    --load \
                    --file docker/build/ci.Dockerfile \
                    --tag ksbh-ci:pr-check \
                    .

            - name: Build and push CI image
              if: ${{ forge.event_name != 'pull_request' }}
              shell: bash
              run: |
                  set -euo pipefail

                  if [ -z "${HARBOR_HOST:-}" ]; then
                    echo "HARBOR_HOST is required to publish the CI base image" >&2
                    exit 1
                  fi

                  ci_image_repository="${HARBOR_HOST}/registry/ksbh-ci"
                  build_stamp="$(date -u +%Y%m%d%H%M%S)"
                  short_sha="$(printf '%s' "${LOCAL_SHA}" | cut -c1-12)"

                  docker buildx build \
                    --pull \
                    --push \
                    --file docker/build/ci.Dockerfile \
                    --tag "${ci_image_repository}:latest" \
                    --tag "${ci_image_repository}:${LOCAL_SHA}" \
                    --tag "${ci_image_repository}:build-${build_stamp}-${short_sha}" \
                    .
