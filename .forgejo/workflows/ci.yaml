name: ci

on:
    push:
        branches:
            - main
            - dev
    pull_request:
    workflow_dispatch:

env:
    LOCAL_SHA: ${{ forge.sha || env.FORGEJO_SHA || env.LOCAL_SHA }}
    LOCAL_REF_NAME: ${{ forge.ref_name || env.FORGEJO_REF_NAME || env.LOCAL_REF_NAME }}
    CI_BASE_IMAGE_TAG: ${{ vars.CI_BASE_IMAGE_TAG || env.CI_BASE_IMAGE_TAG || 'latest' }}
    CI_BASE_IMAGE: ${{ vars.CI_BASE_IMAGE || env.CI_BASE_IMAGE || format('{0}/registry/ksbh-ci:{1}', vars.HARBOR_HOST || env.HARBOR_HOST, vars.CI_BASE_IMAGE_TAG || env.CI_BASE_IMAGE_TAG || 'latest') }}
    RUSTC_WRAPPER: /root/.cargo/bin/sccache
    MISE_TASK_OUTPUT: interleave
    MISE_YES: "true"
    NO_COLOR: "1"

jobs:
    build-rust:
        runs-on: cocaine
        container:
            image: ${{ env.CI_BASE_IMAGE }}
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: https://data.forgejo.org/actions/checkout@v4

            - name: Restore Rust build cache
              uses: https://data.forgejo.org/actions/cache@v4
              with:
                  path: |
                      /root/.cargo/registry
                      /root/.cargo/git
                      crates/target
                  key: rust-build-${{ forge.ref_name }}-${{ hashFiles('crates/Cargo.lock') }}
                  restore-keys: |
                      rust-build-${{ forge.ref_name }}-
                      rust-build-

            - name: Build Rust outputs
              shell: bash
              run: |
                  set -euo pipefail
                  mise run --skip-tools build-rust compile-test-binaries

            - name: Upload Rust prebuilt artifact
              uses: https://data.forgejo.org/actions/upload-artifact@v3-node20
              with:
                  name: rust-prebuilt
                  path: |
                      crates/target/debug/ksbh
                      crates/target/debug/libdynamic_ffi_smoke.*
                      crates/target/debug/*.so
                      crates/target/debug/*.dylib
                      crates/target/debug/deps/*.so
                      crates/target/debug/deps/*.dylib
                      crates/target/debug/deps/binary_baseline_e2e-*
                      crates/target/debug/deps/binary_static_content_e2e-*
                      crates/target/debug/deps/binary_upstream_errors_e2e-*
                      crates/target/debug/deps/k8s_baseline_e2e-*
                      crates/target/debug/deps/k8s_ingress_lifecycle_e2e-*
                      crates/target/debug/deps/k8s_static_content_e2e-*
                      crates/target/debug/deps/k8s_robots_txt_e2e-*
                      crates/target/debug/deps/k8s_pow_http_e2e-*
                      crates/target/debug/deps/k8s_http_to_https_e2e-*
                      crates/target/debug/deps/k8s_trusted_proxies_e2e-*
                      crates/target/debug/deps/k8s_websocket_e2e-*
                      crates/target/debug/deps/module_host_dynamic-*
                      crates/target/debug/deps/ffi_miri-*
                      crates/target/debug/deps/ksbh_modules_sdk-*
                      crates/target/debug/deps/host_functions_unhappy-*
                      crates/target/debug/deps/ksbh_core-*
                  if-no-files-found: error

    test-binary:
        needs:
            - build-rust
        runs-on: cocaine
        container:
            image: ${{ env.CI_BASE_IMAGE }}
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: https://data.forgejo.org/actions/checkout@v4

            - name: Download Rust prebuilt artifact
              uses: https://data.forgejo.org/actions/download-artifact@v3-node20
              with:
                  name: rust-prebuilt
                  path: crates/target/debug

            - name: Run binary e2e
              shell: bash
              env:
                  KSBH_CI_USE_PREBUILT: "true"
              run: |
                  set -euo pipefail
                  mise run --skip-tools test-binary

    test-modules:
        needs:
            - build-rust
        runs-on: cocaine
        container:
            image: ${{ env.CI_BASE_IMAGE }}
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: https://data.forgejo.org/actions/checkout@v4

            - name: Download Rust prebuilt artifact
              uses: https://data.forgejo.org/actions/download-artifact@v3-node20
              with:
                  name: rust-prebuilt
                  path: crates/target/debug

            - name: Run module smoke coverage
              shell: bash
              env:
                  KSBH_CI_USE_PREBUILT: "true"
                  KSBH_DYNAMIC_SMOKE_LOOPS: "500"
              run: |
                  set -euo pipefail
                  mise run --skip-tools test-modules-smoke

            - name: Run unhappy-path coverage
              shell: bash
              env:
                  KSBH_CI_USE_PREBUILT: "true"
              run: |
                  set -euo pipefail
                  mise run --skip-tools test-unhappy

    test-miri:
        needs:
            - build-rust
        runs-on: cocaine
        container:
            image: ${{ env.CI_BASE_IMAGE }}
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: https://data.forgejo.org/actions/checkout@v4

            - name: Run Miri coverage
              shell: bash
              run: |
                  set -euo pipefail
                  mise run --skip-tools test-miri

    test-k8s:
        needs:
            - build-rust
        runs-on: cocaine
        container:
            image: ${{ env.CI_BASE_IMAGE }}
        permissions:
            contents: read
        env:
            HARBOR_HOST: ${{ vars.HARBOR_HOST || env.HARBOR_HOST }}
            KSBH_RELEASE_IMAGE_REPOSITORY: ksbh-ci-e2e
            KSBH_RELEASE_IMAGE_TAG: ${{ forge.sha || env.FORGEJO_SHA || env.LOCAL_SHA }}
            KSBH_E2E_WEBSOCKET_IMAGE: ksbh-e2e-websocket-probe:ci
        steps:
            - name: Check out repository
              uses: https://data.forgejo.org/actions/checkout@v4

            - name: Download Rust prebuilt artifact
              uses: https://data.forgejo.org/actions/download-artifact@v3-node20
              with:
                  name: rust-prebuilt
                  path: crates/target/debug

            - name: Prepare Docker auth
              shell: bash
              run: |
                  set -euo pipefail
                  . ./scripts/ci/prepare-docker-auth.sh

            - name: Run Kubernetes e2e
              shell: bash
              env:
                  KSBH_CI_USE_PREBUILT: "true"
                  KIND_CLUSTER_CONFIG: tests/kind/cluster-ci.yaml
                  KSBH_KIND_API_SERVER_PORT: "16443"
              run: |
                  set -euo pipefail
                  if [ -n "${HARBOR_HOST:-}" ]; then
                    export KSBH_RELEASE_IMAGE_CACHE_REPO="${HARBOR_HOST}/registry-cache/ksbh-release"
                    export KSBH_E2E_WEBSOCKET_CACHE_REPO="${HARBOR_HOST}/registry-cache/ksbh-e2e-websocket-probe"
                  fi
                  mise run --skip-tools test-k8s

    publish-images:
        needs:
            - test-binary
            - test-modules
            - test-miri
            - test-k8s
        if: ${{ forge.event_name != 'pull_request' && (forge.ref_name == 'main' || forge.ref_name == 'dev') }}
        runs-on: cocaine
        container:
            image: ${{ env.CI_BASE_IMAGE }}
        permissions:
            contents: read
        env:
            HARBOR_HOST: ${{ vars.HARBOR_HOST || env.HARBOR_HOST }}
            DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || env.DOCKERHUB_USERNAME }}
            DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN || env.DOCKERHUB_TOKEN }}
            DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || env.DOCKERHUB_REPOSITORY }}
        steps:
            - name: Check out repository
              uses: https://data.forgejo.org/actions/checkout@v4

            - name: Prepare Docker auth
              shell: bash
              run: |
                  set -euo pipefail
                  . ./scripts/ci/prepare-docker-auth.sh

            - name: Authenticate DockerHub
              if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
              shell: bash
              run: |
                  set -euo pipefail
                  echo "${DOCKERHUB_TOKEN}" | docker login --username "${DOCKERHUB_USERNAME}" --password-stdin

            - name: Build and push release/docs/charts images
              shell: bash
              run: |
                  set -euo pipefail

                  if [ -z "${HARBOR_HOST:-}" ]; then
                    echo "HARBOR_HOST is required to publish docs and charts images" >&2
                    exit 1
                  fi

                  image_repository="${DOCKERHUB_REPOSITORY:-${DOCKERHUB_USERNAME}/ksbh}"
                  docs_image_repository="${HARBOR_HOST}/registry/ksbh-docs"
                  charts_image_repository="${HARBOR_HOST}/registry/ksbh-charts"

                  if [ -n "${HARBOR_HOST:-}" ]; then
                    export KSBH_RELEASE_IMAGE_CACHE_REPO="${HARBOR_HOST}/registry-cache/ksbh-release"
                    export KSBH_DOCS_SITE_CACHE_REPO="${HARBOR_HOST}/registry-cache/ksbh-docs"
                    export KSBH_CHARTS_SITE_CACHE_REPO="${HARBOR_HOST}/registry-cache/ksbh-charts"
                  fi

                  if [ "${LOCAL_REF_NAME}" = "main" ]; then
                    primary_tag="$(grep -m1 '^version = "' crates/ksbh-bin/Cargo.toml | sed -E 's/^version = "([^"]+)"$/\1/')"
                    extra_tag=""
                  else
                    primary_tag="$(printf '%s' "${LOCAL_SHA}" | cut -c1-12)-$(date -u +%Y%m%d%H%M%S)"
                    extra_tag="latest-dev"
                  fi

                  export KSBH_RELEASE_IMAGE_REPOSITORY="${image_repository}"
                  export KSBH_RELEASE_IMAGE_TAG="${primary_tag}"
                  export KSBH_RELEASE_IMAGE_PUSH="true"
                  export KSBH_RELEASE_IMAGE_LOAD="false"

                  export KSBH_DOCS_SITE_IMAGE="${docs_image_repository}:${primary_tag}"
                  export KSBH_DOCS_SITE_PUSH="true"
                  export KSBH_DOCS_SITE_LOAD="false"

                  export KSBH_CHARTS_SITE_IMAGE="${charts_image_repository}:${primary_tag}"
                  export KSBH_CHARTS_SITE_PUSH="true"
                  export KSBH_CHARTS_SITE_LOAD="false"

                  mise run --skip-tools build-release-image build-docs-image build-charts-image

                  if [ -n "${extra_tag}" ]; then
                    docker buildx imagetools create -t "${image_repository}:${extra_tag}" "${image_repository}:${primary_tag}"
                    docker buildx imagetools create -t "${docs_image_repository}:${extra_tag}" "${docs_image_repository}:${primary_tag}"
                    docker buildx imagetools create -t "${charts_image_repository}:${extra_tag}" "${charts_image_repository}:${primary_tag}"
                  fi

    helm-artifacts:
        needs:
            - test-binary
            - test-modules
            - test-miri
            - test-k8s
        runs-on: cocaine
        container:
            image: ${{ env.CI_BASE_IMAGE }}
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: https://data.forgejo.org/actions/checkout@v4

            - name: Lint and package Helm chart
              shell: bash
              run: |
                  set -euo pipefail
                  mise run --skip-tools lint-helm package-helm

            - name: Upload Helm chart artifact
              uses: https://data.forgejo.org/actions/upload-artifact@v3-node20
              with:
                  name: ksbh-helm-chart-${{ forge.ref_name }}
                  path: dist/helm/*.tar.gz
                  if-no-files-found: error
