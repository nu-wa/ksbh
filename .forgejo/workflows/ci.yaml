name: ci

on:
    push:
        branches:
            - main
            - dev
        tags:
            - v*
    pull_request:
    workflow_dispatch:

env:
    LOCAL_SHA: ${{ forge.sha }}
    LOCAL_REF_NAME: ${{ forge.ref_name }}
    MISE_TASK_OUTPUT: interleave
    MISE_YES: "true"
    NO_COLOR: "1"

jobs:
    resolve-images:
        runs-on: cocaine
        container:
            image: ${{ vars.HARBOR_HOST }}/registry/act-base:latest
            credentials:
                username: ${{ secrets.HARBOR_USERNAME }}
                password: ${{ secrets.HARBOR_PASSWORD }}
        outputs:
            rust: ${{ steps.inspect.outputs.rust }}
            rust_kind_playwright: ${{ steps.inspect.outputs.rust_kind_playwright }}
            rust_wasm_node: ${{ steps.inspect.outputs.rust_wasm_node }}
        steps:
            - name: Check out repository
              uses: https://data.forgejo.org/actions/checkout@v4

            - name: Inspect latest image digests
              id: inspect
              env:
                  HARBOR_HOST: ${{ vars.HARBOR_HOST }}
                  HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
                  HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
              run: |
                  set -euo pipefail
                  . ./scripts/ci/prepare-docker-auth.sh
                  output_file="${GITHUB_OUTPUT:-${FORGEJO_OUTPUT:?GITHUB_OUTPUT/FORGEJO_OUTPUT is not set}}"

                  resolve_image() {
                    local output_name="$1"
                    local image_name="$2"
                    local ref="${HARBOR_HOST}/registry/${image_name}:latest"
                    local digest

                    digest=$(docker manifest inspect "${ref}" | jq -r '.manifests[] | select(.platform.architecture == "amd64" and .platform.os == "linux") | .digest')
                    if [ -z "${digest}" ] || [ "${digest}" = "null" ]; then
                      echo "::error::Failed to resolve linux/amd64 digest for ${ref}" >&2
                      docker manifest inspect "${ref}" >&2 || true
                      exit 1
                    fi

                    pin="${ref%:*}@${digest}"
                    echo "${output_name}=${pin}" >> "${output_file}"
                    echo "Resolved ${image_name}: ${pin}"
                  }

                  resolve_image rust act-rust
                  resolve_image rust_kind_playwright act-rust-kind-playwright
                  resolve_image rust_wasm_node act-rust-wasm-node

    build-rust:
        needs:
            - resolve-images
        runs-on: cocaine
        container:
            image: ${{ needs.resolve-images.outputs.rust }}
            credentials:
                username: ${{ secrets.HARBOR_USERNAME }}
                password: ${{ secrets.HARBOR_PASSWORD }}
        env:
            SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
            SCCACHE_REGION: ${{ secrets.SCCACHE_REGION }}
            SCCACHE_S3_USE_SSL: ${{ secrets.SCCACHE_S3_USE_SSL }}
            SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
            SCCACHE_S3_ENABLE_VIRTUAL_HOST_STYLE: ${{ secrets.SCCACHE_S3_ENABLE_VIRTUAL_HOST_STYLE }}
            SCCACHE_S3_KEY_PREFIX: ksbh
            AWS_REGION: ${{ secrets.SCCACHE_REGION }}
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: https://data.forgejo.org/actions/checkout@v4

            - name: Restore Rust build cache
              uses: https://data.forgejo.org/actions/cache@v4
              with:
                  path: |
                      /root/.cargo/registry
                      /root/.cargo/git
                      /root/.cache/sccache
                      /root/.cache/mise
                      /root/.local/share/mise
                      /root/.local/state/mise
                  key: rust-build-v4-act-rust-${{ forge.ref_name }}-${{ hashFiles('mise.toml', 'crates/Cargo.lock') }}
                  restore-keys: |
                      rust-build-v4-act-rust-${{ forge.ref_name }}-
                      rust-build-v4-act-rust-

            - name: Verify CI toolchain
              shell: bash
              run: |
                  set -euo pipefail
                  echo "PATH=${PATH}"
                  command -v mise
                  command -v rustc
                  command -v cargo
                  command -v sccache
                  mise --version
                  rustc --version
                  cargo --version
                  sccache --version

            - name: Build Rust outputs
              shell: bash
              run: |
                  set -euo pipefail
                  export RUSTC_WRAPPER="$(command -v sccache)"
                  mise run compile-test-binaries

            - name: Stage Rust prebuilt artifacts
              shell: bash
              run: |
                  set -euo pipefail

                  source_dir="crates/target/debug"
                  deps_dir="${source_dir}/deps"
                  artifact_dir=".ci-artifacts"

                  rm -rf "${artifact_dir}"
                  mkdir -p \
                    "${artifact_dir}/binary/deps" \
                    "${artifact_dir}/modules/deps" \
                    "${artifact_dir}/k8s/deps"

                  copy_file() {
                    local src="$1"
                    local dst="$2"
                    if [ ! -f "${src}" ]; then
                      echo "required artifact missing: ${src}" >&2
                      exit 1
                    fi
                    cp -a "${src}" "${dst}"
                  }

                  copy_test_binary() {
                    local prefix="$1"
                    local dst_dir="$2"
                    local src
                    src="$(
                      find "${deps_dir}" -maxdepth 1 -type f -name "${prefix}-*" \
                        ! -name '*.d' \
                        ! -name '*.rlib' \
                        ! -name '*.rmeta' \
                        | sort \
                        | head -n 1
                    )"
                    if [ -z "${src}" ]; then
                      echo "required test binary missing for prefix: ${prefix}" >&2
                      exit 1
                    fi
                    cp -a "${src}" "${dst_dir}/"
                  }

                  copy_dynamic_lib() {
                    local prefix="$1"
                    local dst_dir="$2"
                    local src
                    src="$(
                      find "${source_dir}" -maxdepth 1 -type f -name "${prefix}.*" \
                        ! -name '*.d' \
                        | sort \
                        | head -n 1
                    )"
                    if [ -z "${src}" ]; then
                      echo "required dynamic library missing for prefix: ${prefix}" >&2
                      exit 1
                    fi
                    cp -a "${src}" "${dst_dir}/"
                  }

                  copy_file "${source_dir}/ksbh" "${artifact_dir}/binary/ksbh"
                  copy_test_binary binary_baseline_e2e "${artifact_dir}/binary/deps"
                  copy_test_binary binary_static_content_e2e "${artifact_dir}/binary/deps"
                  copy_test_binary binary_upstream_errors_e2e "${artifact_dir}/binary/deps"

                  copy_dynamic_lib libdynamic_ffi_smoke "${artifact_dir}/modules"
                  copy_test_binary module_host_dynamic "${artifact_dir}/modules/deps"
                  copy_test_binary ffi_miri "${artifact_dir}/modules/deps"
                  copy_test_binary ksbh_modules_sdk "${artifact_dir}/modules/deps"
                  copy_test_binary host_functions_unhappy "${artifact_dir}/modules/deps"
                  copy_test_binary ksbh_core "${artifact_dir}/modules/deps"

                  copy_file "${source_dir}/ksbh" "${artifact_dir}/k8s/ksbh"
                  copy_test_binary k8s_baseline_e2e "${artifact_dir}/k8s/deps"
                  copy_test_binary k8s_ingress_lifecycle_e2e "${artifact_dir}/k8s/deps"
                  copy_test_binary k8s_static_content_e2e "${artifact_dir}/k8s/deps"
                  copy_test_binary k8s_robots_txt_e2e "${artifact_dir}/k8s/deps"
                  copy_test_binary k8s_pow_http_e2e "${artifact_dir}/k8s/deps"
                  copy_test_binary k8s_http_to_https_e2e "${artifact_dir}/k8s/deps"
                  copy_test_binary k8s_trusted_proxies_e2e "${artifact_dir}/k8s/deps"
                  copy_test_binary k8s_websocket_e2e "${artifact_dir}/k8s/deps"

                  du -sh "${artifact_dir}"/*

            - name: Upload Rust prebuilt artifact
              uses: https://data.forgejo.org/actions/upload-artifact@v3-node20
              with:
                  name: rust-prebuilt-binary
                  path: |
                      .ci-artifacts/binary/ksbh
                      .ci-artifacts/binary/deps/*
                  if-no-files-found: error

            - name: Upload module prebuilt artifact
              uses: https://data.forgejo.org/actions/upload-artifact@v3-node20
              with:
                  name: rust-prebuilt-modules
                  path: |
                      .ci-artifacts/modules/libdynamic_ffi_smoke.*
                      .ci-artifacts/modules/deps/*
                  if-no-files-found: error

            - name: Upload Kubernetes prebuilt artifact
              uses: https://data.forgejo.org/actions/upload-artifact@v3-node20
              with:
                  name: rust-prebuilt-k8s
                  path: |
                      .ci-artifacts/k8s/ksbh
                      .ci-artifacts/k8s/deps/*
                  if-no-files-found: error

    build-release-image:
        needs:
            - resolve-images
            - build-rust
        runs-on: cocaine
        container:
            image: ${{ needs.resolve-images.outputs.rust }}
            credentials:
                username: ${{ secrets.HARBOR_USERNAME }}
                password: ${{ secrets.HARBOR_PASSWORD }}
        env:
            SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
            SCCACHE_REGION: ${{ secrets.SCCACHE_REGION }}
            SCCACHE_S3_USE_SSL: ${{ secrets.SCCACHE_S3_USE_SSL }}
            SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
            SCCACHE_S3_ENABLE_VIRTUAL_HOST_STYLE: ${{ secrets.SCCACHE_S3_ENABLE_VIRTUAL_HOST_STYLE }}
            SCCACHE_S3_KEY_PREFIX: ksbh
            AWS_REGION: ${{ secrets.SCCACHE_REGION }}
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: https://data.forgejo.org/actions/checkout@v4

            - name: Restore Rust build cache
              uses: https://data.forgejo.org/actions/cache@v4
              with:
                  path: |
                      /root/.cargo/registry
                      /root/.cargo/git
                      /root/.cache/sccache
                      /root/.cache/mise
                      /root/.local/share/mise
                      /root/.local/state/mise
                  key: rust-build-v4-act-rust-${{ forge.ref_name }}-${{ hashFiles('mise.toml', 'crates/Cargo.lock') }}
                  restore-keys: |
                      rust-build-v4-act-rust-${{ forge.ref_name }}-
                      rust-build-v4-act-rust-

            - name: Build and push release Docker image
              env:
                  HARBOR_HOST: ${{ vars.HARBOR_HOST }}
                  HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
                  HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
                  KSBH_RELEASE_IMAGE: ${{ vars.HARBOR_HOST }}/registry/ksbh-release:${{ forge.sha }}
                  KSBH_RELEASE_IMAGE_REPOSITORY: ${{ vars.HARBOR_HOST }}/registry/ksbh-release
                  KSBH_RELEASE_IMAGE_TAG: ${{ forge.sha }}
                  KSBH_RELEASE_IMAGE_PUSH: "true"
                  KSBH_RELEASE_IMAGE_LOAD: "false"
                  KSBH_RELEASE_BUILDER_IMAGE: ${{ needs.resolve-images.outputs.rust }}
                  KSBH_RELEASE_IMAGE_CACHE_WRITE: "false"
              shell: bash
              run: |
                  set -euo pipefail
                  . ./scripts/ci/prepare-docker-auth.sh
                  export KSBH_RELEASE_IMAGE_CACHE_REPO="${HARBOR_HOST}/registry/ksbh-release-buildcache"
                  mise run build-release-image

    test-binary:
        needs:
            - resolve-images
            - build-rust
        runs-on: cocaine
        container:
            image: ${{ needs.resolve-images.outputs.rust }}
            credentials:
                username: ${{ secrets.HARBOR_USERNAME }}
                password: ${{ secrets.HARBOR_PASSWORD }}
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: https://data.forgejo.org/actions/checkout@v4

            - name: Download Rust prebuilt artifact
              uses: https://data.forgejo.org/actions/download-artifact@v3-node20
              with:
                  name: rust-prebuilt-binary
                  path: crates/target/debug

            - name: Run binary e2e
              shell: bash
              env:
                  KSBH_CI_USE_PREBUILT: "true"
              run: |
                  set -euo pipefail
                  bash mise-tasks/e2e-binary

    test-modules:
        needs:
            - resolve-images
            - build-rust
        runs-on: cocaine
        container:
            image: ${{ needs.resolve-images.outputs.rust }}
            credentials:
                username: ${{ secrets.HARBOR_USERNAME }}
                password: ${{ secrets.HARBOR_PASSWORD }}
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: https://data.forgejo.org/actions/checkout@v4

            - name: Download Rust prebuilt artifact
              uses: https://data.forgejo.org/actions/download-artifact@v3-node20
              with:
                  name: rust-prebuilt-modules
                  path: crates/target/debug

            - name: Run module smoke coverage
              shell: bash
              env:
                  KSBH_CI_USE_PREBUILT: "true"
                  KSBH_DYNAMIC_SMOKE_LOOPS: "500"
              run: |
                  set -euo pipefail
                  bash mise-tasks/dynamic-modules-smoke

            - name: Run unhappy-path coverage
              shell: bash
              env:
                  KSBH_CI_USE_PREBUILT: "true"
              run: |
                  set -euo pipefail
                  bash mise-tasks/p0-unhappy-tests

    test-miri:
        needs:
            - resolve-images
        runs-on: cocaine
        container:
            image: ${{ needs.resolve-images.outputs.rust }}
            credentials:
                username: ${{ secrets.HARBOR_USERNAME }}
                password: ${{ secrets.HARBOR_PASSWORD }}
        env:
            SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
            SCCACHE_REGION: ${{ secrets.SCCACHE_REGION }}
            SCCACHE_S3_USE_SSL: ${{ secrets.SCCACHE_S3_USE_SSL }}
            SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
            SCCACHE_S3_ENABLE_VIRTUAL_HOST_STYLE: ${{ secrets.SCCACHE_S3_ENABLE_VIRTUAL_HOST_STYLE }}
            SCCACHE_S3_KEY_PREFIX: ksbh
            AWS_REGION: ${{ secrets.SCCACHE_REGION }}
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: https://data.forgejo.org/actions/checkout@v4

            - name: Restore Miri cache
              uses: https://data.forgejo.org/actions/cache@v4
              with:
                  path: .ci-cache/miri
                  key: miri-v3-act-rust-${{ forge.ref_name }}-${{ hashFiles('mise.toml', 'crates/Cargo.lock') }}
                  restore-keys: |
                      miri-v3-act-rust-${{ forge.ref_name }}-
                      miri-v3-act-rust-

            - name: Run Miri coverage
              shell: bash
              run: |
                  set -euo pipefail
                  export KSBH_MIRI_RUSTUP_HOME="${PWD}/.ci-cache/miri/rustup"
                  export KSBH_MIRI_CARGO_HOME="${PWD}/.ci-cache/miri/cargo"
                  export KSBH_MIRI_TARGET_DIR="${PWD}/.ci-cache/miri/target"
                  mise run test-miri

    test-k8s:
        needs:
            - resolve-images
            - build-rust
            - build-release-image
        runs-on: cocaine
        container:
            image: ${{ needs.resolve-images.outputs.rust_kind_playwright }}
            credentials:
                username: ${{ secrets.HARBOR_USERNAME }}
                password: ${{ secrets.HARBOR_PASSWORD }}
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: https://data.forgejo.org/actions/checkout@v4

            - name: Download Rust prebuilt artifact
              uses: https://data.forgejo.org/actions/download-artifact@v3-node20
              with:
                  name: rust-prebuilt-k8s
                  path: crates/target/debug

            - name: Run Kubernetes e2e
              shell: bash
              env:
                  HARBOR_HOST: ${{ vars.HARBOR_HOST }}
                  HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
                  HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
                  KSBH_CI_USE_PREBUILT: "true"
                  KSBH_RELEASE_IMAGE: ${{ vars.HARBOR_HOST }}/registry/ksbh-release:${{ forge.sha }}
                  KSBH_RELEASE_IMAGE_REPOSITORY: ${{ vars.HARBOR_HOST }}/registry/ksbh-release
                  KSBH_RELEASE_IMAGE_TAG: ${{ forge.sha }}
                  KSBH_RELEASE_IMAGE_PUSH: "true"
                  KSBH_E2E_WEBSOCKET_IMAGE: ksbh-e2e-websocket-probe:ci
                  KSBH_E2E_SKIP_RELEASE_BUILD: "true"
                  KIND_CLUSTER_CONFIG: tests/kind/cluster-ci.yaml
                  KSBH_KIND_API_SERVER_PORT: "16443"
              run: |
                  set -euo pipefail
                  . ./scripts/ci/prepare-docker-auth.sh

                  if [ -n "${HARBOR_HOST:-}" ] && [ -n "${HARBOR_USERNAME:-}" ] && [ -n "${HARBOR_PASSWORD:-}" ]; then
                    export KSBH_RELEASE_IMAGE_CACHE_REPO="${HARBOR_HOST}/registry/ksbh-release-buildcache"
                    export KSBH_E2E_WEBSOCKET_CACHE_REPO="${HARBOR_HOST}/registry/ksbh-e2e-websocket-probe-buildcache"
                  fi
                  bash mise-tasks/e2e

    publish-images:
        needs:
            - resolve-images
            - test-binary
            - test-modules
            - test-miri
            - test-k8s
        if: ${{ forge.event_name != 'pull_request' }}
        runs-on: cocaine
        container:
            image: ${{ needs.resolve-images.outputs.rust_wasm_node }}
            credentials:
                username: ${{ secrets.HARBOR_USERNAME }}
                password: ${{ secrets.HARBOR_PASSWORD }}
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: https://data.forgejo.org/actions/checkout@v4

            - name: Restore docs npm cache
              uses: https://data.forgejo.org/actions/cache@v4
              with:
                  path: |
                      docs/node_modules
                      /root/.npm
                  key: docs-npm-v2-act-rust-wasm-node-${{ hashFiles('docs/package.json') }}
                  restore-keys: |
                      docs-npm-v2-act-rust-wasm-node-

            - name: Restore Dodeca cache
              uses: https://data.forgejo.org/actions/cache@v4
              with:
                  path: |
                      .ci-cache/dodeca-install
                      .ci-cache/dodeca-target
                      /root/.cargo/registry
                      /root/.cargo/git
                  key: dodeca-v2-act-rust-wasm-node-v0.14.2-4c25f36b64b9ec5aab5612a924b1264defa141d6
                  restore-keys: |
                      dodeca-v2-act-rust-wasm-node-

            - name: Prepare publish tooling
              shell: bash
              env:
                  DODECA_VERSION: v0.14.2
                  DODECA_SHA: 4c25f36b64b9ec5aab5612a924b1264defa141d6
              run: |
                  set -euo pipefail
                  bash scripts/ci/prepare-publish-tooling.sh

            - name: Build and push release/docs/charts images
              shell: bash
              env:
                  HARBOR_HOST: ${{ vars.HARBOR_HOST }}
                  HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
                  HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
                  DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
              run: |
                  set -euo pipefail
                  export PATH="${PWD}/docs/node_modules/.bin:${PWD}/.ci-cache/dodeca-install/bin:${PATH}"
                  . ./scripts/ci/prepare-docker-auth.sh

                  cargo_version="$(grep -m1 '^version = "' crates/ksbh-bin/Cargo.toml | sed -E 's/^version = "([^"]+)"$/\1/')"
                  extra_tag=""
                  case "${LOCAL_REF_NAME}" in
                    dev)
                      primary_tag="$(printf '%s' "${LOCAL_SHA}" | cut -c1-12)-$(date -u +%Y%m%d%H%M%S)"
                      extra_tag="latest-dev"
                      ;;
                    v*)
                      primary_tag="${LOCAL_REF_NAME#v}"
                      if [ "${primary_tag}" != "${cargo_version}" ]; then
                        echo "release tag ${LOCAL_REF_NAME} does not match Cargo version ${cargo_version}" >&2
                        exit 1
                      fi
                      ;;
                    *)
                      echo "no image publish for ref '${LOCAL_REF_NAME}'"
                      exit 0
                      ;;
                  esac

                  if [ -z "${HARBOR_HOST:-}" ]; then
                    echo "HARBOR_HOST is required to publish docs and charts images" >&2
                    exit 1
                  fi
                  if [ -z "${HARBOR_USERNAME:-}" ] || [ -z "${HARBOR_PASSWORD:-}" ]; then
                    echo "HARBOR_USERNAME and HARBOR_PASSWORD are required to publish docs and charts images" >&2
                    exit 1
                  fi
                  if [ -z "${DOCKERHUB_REPOSITORY:-}" ] && [ -z "${DOCKERHUB_USERNAME:-}" ]; then
                    echo "DOCKERHUB_REPOSITORY or DOCKERHUB_USERNAME is required to publish the release image" >&2
                    exit 1
                  fi
                  if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
                    echo "${DOCKERHUB_TOKEN}" | docker login --username "${DOCKERHUB_USERNAME}" --password-stdin
                  elif [ -n "${DOCKERHUB_USERNAME:-}" ] || [ -n "${DOCKERHUB_TOKEN:-}" ]; then
                    echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be set together" >&2
                    exit 1
                  fi

                  image_repository="${DOCKERHUB_REPOSITORY:-${DOCKERHUB_USERNAME}/ksbh}"
                  docs_image_repository="${HARBOR_HOST}/registry/ksbh-docs"
                  charts_image_repository="${HARBOR_HOST}/registry/ksbh-charts"

                  if [ -n "${HARBOR_HOST:-}" ] && [ -n "${HARBOR_USERNAME:-}" ] && [ -n "${HARBOR_PASSWORD:-}" ]; then
                    export KSBH_RELEASE_IMAGE_CACHE_REPO="${HARBOR_HOST}/registry/ksbh-release-buildcache"
                    export KSBH_DOCS_SITE_CACHE_REPO="${HARBOR_HOST}/registry/ksbh-docs-buildcache"
                    export KSBH_CHARTS_SITE_CACHE_REPO="${HARBOR_HOST}/registry/ksbh-charts-buildcache"
                  fi

                  export KSBH_DOCS_SITE_IMAGE="${docs_image_repository}:${primary_tag}"
                  export KSBH_DOCS_SITE_PUSH="true"
                  export KSBH_DOCS_SITE_LOAD="false"

                  export KSBH_CHARTS_SITE_IMAGE="${charts_image_repository}:${primary_tag}"
                  export KSBH_CHARTS_SITE_PUSH="true"
                  export KSBH_CHARTS_SITE_LOAD="false"

                  # Consume the release image built before Kubernetes tests.
                  harbor_release_image="${HARBOR_HOST}/registry/ksbh-release:${LOCAL_SHA}"
                  if ! docker pull "${harbor_release_image}"; then
                    echo "failed to pull release image from Harbor: ${harbor_release_image}" >&2
                    exit 1
                  fi
                  docker tag "${harbor_release_image}" "${image_repository}:${primary_tag}"
                  docker push "${image_repository}:${primary_tag}"

                  bash mise-tasks/build-docs-site
                  bash mise-tasks/build-docs-site-image
                  bash mise-tasks/build-helm-repo
                  bash mise-tasks/build-charts-site-image

                  if [ -n "${extra_tag}" ]; then
                    docker buildx imagetools create -t "${image_repository}:${extra_tag}" "${image_repository}:${primary_tag}"
                    docker buildx imagetools create -t "${docs_image_repository}:${extra_tag}" "${docs_image_repository}:${primary_tag}"
                    docker buildx imagetools create -t "${charts_image_repository}:${extra_tag}" "${charts_image_repository}:${primary_tag}"
                  fi

    helm-artifacts:
        needs:
            - resolve-images
        runs-on: cocaine
        container:
            image: ${{ needs.resolve-images.outputs.rust_kind_playwright }}
            credentials:
                username: ${{ secrets.HARBOR_USERNAME }}
                password: ${{ secrets.HARBOR_PASSWORD }}
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: https://data.forgejo.org/actions/checkout@v4

            - name: Lint and package Helm chart
              shell: bash
              run: |
                  set -euo pipefail
                  bash mise-tasks/lint-helm-chart
                  bash mise-tasks/package-helm-chart

            - name: Upload Helm chart artifact
              uses: https://data.forgejo.org/actions/upload-artifact@v3-node20
              with:
                  name: ksbh-helm-chart-${{ forge.ref_name }}
                  path: dist/helm/*.tar.gz
                  if-no-files-found: error
