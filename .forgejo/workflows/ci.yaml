name: ci

on:
    push:
        branches:
            - main
            - dev
        tags:
            - v*
    pull_request:
    workflow_dispatch:

env:
    LOCAL_SHA: ${{ forge.sha }}
    LOCAL_REF_NAME: ${{ forge.ref_name }}
    MISE_TASK_OUTPUT: interleave
    MISE_YES: "true"
    NO_COLOR: "1"

jobs:
    build-rust:
        runs-on: cocaine
        container:
            image: ${{ vars.CI_BASE_IMAGE }}
            credentials:
                username: ${{ secrets.HARBOR_USERNAME }}
                password: ${{ secrets.HARBOR_PASSWORD }}
        env:
            SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
            SCCACHE_REGION: ${{ secrets.SCCACHE_REGION }}
            SCCACHE_S3_USE_SSL: ${{ secrets.SCCACHE_S3_USE_SSL }}
            SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
            SCCACHE_S3_ENABLE_VIRTUAL_HOST_STYLE: ${{ secrets.SCCACHE_S3_ENABLE_VIRTUAL_HOST_STYLE }}
            SCCACHE_S3_KEY_PREFIX: ksbh
            AWS_REGION: ${{ secrets.SCCACHE_REGION }}
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: https://data.forgejo.org/actions/checkout@v4

            - name: Restore Rust build cache
              uses: https://data.forgejo.org/actions/cache@v4
              with:
                  path: |
                      /root/.cargo/registry
                      /root/.cargo/git
                      /root/.cache/sccache
                      /root/.cache/mise
                      /root/.local/share/mise
                      /root/.local/state/mise
                  key: rust-build-v3-${{ vars.CI_BASE_IMAGE }}-${{ forge.ref_name }}-${{ hashFiles('crates/Cargo.lock') }}
                  restore-keys: |
                      rust-build-v3-${{ vars.CI_BASE_IMAGE }}-${{ forge.ref_name }}-
                      rust-build-v3-${{ vars.CI_BASE_IMAGE }}-
                      rust-build-v3-

            - name: Verify CI toolchain
              shell: bash
              run: |
                  set -euo pipefail
                  echo "PATH=${PATH}"
                  command -v mise
                  command -v rustc
                  command -v cargo
                  command -v sccache
                  mise --version
                  rustc --version
                  cargo --version
                  sccache --version

            - name: Build Rust outputs
              shell: bash
              run: |
                  set -euo pipefail
                  export RUSTC_WRAPPER="$(command -v sccache)"
                  mise run compile-test-binaries

            - name: Upload Rust prebuilt artifact
              uses: https://data.forgejo.org/actions/upload-artifact@v4
              with:
                  name: rust-prebuilt-binary
                  path: |
                      crates/target/debug/ksbh
                      crates/target/debug/*.so
                      crates/target/debug/*.dylib
                      crates/target/debug/deps/*.so
                      crates/target/debug/deps/*.dylib
                      crates/target/debug/deps/binary_baseline_e2e-*
                      crates/target/debug/deps/binary_static_content_e2e-*
                      crates/target/debug/deps/binary_upstream_errors_e2e-*
                  if-no-files-found: error

            - name: Upload module prebuilt artifact
              uses: https://data.forgejo.org/actions/upload-artifact@v4
              with:
                  name: rust-prebuilt-modules
                  path: |
                      crates/target/debug/libdynamic_ffi_smoke.*
                      crates/target/debug/*.so
                      crates/target/debug/*.dylib
                      crates/target/debug/deps/*.so
                      crates/target/debug/deps/*.dylib
                      crates/target/debug/deps/module_host_dynamic-*
                      crates/target/debug/deps/ffi_miri-*
                      crates/target/debug/deps/ksbh_modules_sdk-*
                      crates/target/debug/deps/host_functions_unhappy-*
                      crates/target/debug/deps/ksbh_core-*
                  if-no-files-found: error

            - name: Upload Kubernetes prebuilt artifact
              uses: https://data.forgejo.org/actions/upload-artifact@v4
              with:
                  name: rust-prebuilt-k8s
                  path: |
                      crates/target/debug/ksbh
                      crates/target/debug/*.so
                      crates/target/debug/*.dylib
                      crates/target/debug/deps/*.so
                      crates/target/debug/deps/*.dylib
                      crates/target/debug/deps/k8s_baseline_e2e-*
                      crates/target/debug/deps/k8s_ingress_lifecycle_e2e-*
                      crates/target/debug/deps/k8s_static_content_e2e-*
                      crates/target/debug/deps/k8s_robots_txt_e2e-*
                      crates/target/debug/deps/k8s_pow_http_e2e-*
                      crates/target/debug/deps/k8s_http_to_https_e2e-*
                      crates/target/debug/deps/k8s_trusted_proxies_e2e-*
                      crates/target/debug/deps/k8s_websocket_e2e-*
                  if-no-files-found: error

    test-binary:
        needs:
            - build-rust
        runs-on: cocaine
        container:
            image: ${{ vars.CI_BASE_IMAGE }}
            credentials:
                username: ${{ secrets.HARBOR_USERNAME }}
                password: ${{ secrets.HARBOR_PASSWORD }}
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: https://data.forgejo.org/actions/checkout@v4

            - name: Download Rust prebuilt artifact
              uses: https://data.forgejo.org/actions/download-artifact@v4
              with:
                  name: rust-prebuilt-binary
                  path: crates/target/debug

            - name: Run binary e2e
              shell: bash
              env:
                  KSBH_CI_USE_PREBUILT: "true"
              run: |
                  set -euo pipefail
                  bash mise-tasks/e2e-binary

    test-modules:
        needs:
            - build-rust
        runs-on: cocaine
        container:
            image: ${{ vars.CI_BASE_IMAGE }}
            credentials:
                username: ${{ secrets.HARBOR_USERNAME }}
                password: ${{ secrets.HARBOR_PASSWORD }}
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: https://data.forgejo.org/actions/checkout@v4

            - name: Download Rust prebuilt artifact
              uses: https://data.forgejo.org/actions/download-artifact@v4
              with:
                  name: rust-prebuilt-modules
                  path: crates/target/debug

            - name: Run module smoke coverage
              shell: bash
              env:
                  KSBH_CI_USE_PREBUILT: "true"
                  KSBH_DYNAMIC_SMOKE_LOOPS: "500"
              run: |
                  set -euo pipefail
                  bash mise-tasks/dynamic-modules-smoke

            - name: Run unhappy-path coverage
              shell: bash
              env:
                  KSBH_CI_USE_PREBUILT: "true"
              run: |
                  set -euo pipefail
                  bash mise-tasks/p0-unhappy-tests

    test-miri:
        runs-on: cocaine
        container:
            image: ${{ vars.CI_BASE_IMAGE }}
            credentials:
                username: ${{ secrets.HARBOR_USERNAME }}
                password: ${{ secrets.HARBOR_PASSWORD }}
        env:
            SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
            SCCACHE_REGION: ${{ secrets.SCCACHE_REGION }}
            SCCACHE_S3_USE_SSL: ${{ secrets.SCCACHE_S3_USE_SSL }}
            SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
            SCCACHE_S3_ENABLE_VIRTUAL_HOST_STYLE: ${{ secrets.SCCACHE_S3_ENABLE_VIRTUAL_HOST_STYLE }}
            SCCACHE_S3_KEY_PREFIX: ksbh
            AWS_REGION: ${{ secrets.SCCACHE_REGION }}
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: https://data.forgejo.org/actions/checkout@v4

            - name: Restore Miri cache
              uses: https://data.forgejo.org/actions/cache@v4
              with:
                  path: .ci-cache/miri
                  key: miri-v2-${{ vars.CI_BASE_IMAGE }}-${{ forge.ref_name }}-${{ hashFiles('crates/Cargo.lock') }}
                  restore-keys: |
                      miri-v2-${{ vars.CI_BASE_IMAGE }}-${{ forge.ref_name }}-
                      miri-v2-${{ vars.CI_BASE_IMAGE }}-
                      miri-v2-

            - name: Run Miri coverage
              shell: bash
              run: |
                  set -euo pipefail
                  export KSBH_MIRI_RUSTUP_HOME="${PWD}/.ci-cache/miri/rustup"
                  export KSBH_MIRI_CARGO_HOME="${PWD}/.ci-cache/miri/cargo"
                  export KSBH_MIRI_TARGET_DIR="${PWD}/.ci-cache/miri/target"
                  mise run test-miri

    test-k8s:
        needs:
            - build-rust
        runs-on: cocaine
        container:
            image: ${{ vars.CI_BASE_IMAGE }}
            credentials:
                username: ${{ secrets.HARBOR_USERNAME }}
                password: ${{ secrets.HARBOR_PASSWORD }}
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: https://data.forgejo.org/actions/checkout@v4

            - name: Download Rust prebuilt artifact
              uses: https://data.forgejo.org/actions/download-artifact@v4
              with:
                  name: rust-prebuilt-k8s
                  path: crates/target/debug

            - name: Run Kubernetes e2e
              shell: bash
              env:
                  HARBOR_HOST: ${{ vars.HARBOR_HOST }}
                  HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
                  HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
                  KSBH_CI_USE_PREBUILT: "true"
                  KSBH_RELEASE_IMAGE: ${{ vars.HARBOR_HOST }}/registry/ksbh-release-buildcache-e2e:${{ forge.sha }}
                  KSBH_RELEASE_IMAGE_REPOSITORY: ${{ vars.HARBOR_HOST }}/registry/ksbh-release-buildcache-e2e
                  KSBH_RELEASE_IMAGE_TAG: ${{ forge.sha }}
                  KSBH_RELEASE_IMAGE_PUSH: "true"
                  KSBH_E2E_WEBSOCKET_IMAGE: ksbh-e2e-websocket-probe:ci
                  KSBH_E2E_PLAYWRIGHT_DRIVER: local
                  KIND_CLUSTER_CONFIG: tests/kind/cluster-ci.yaml
                  KSBH_KIND_API_SERVER_PORT: "16443"
              run: |
                  set -euo pipefail
                  . ./scripts/ci/prepare-docker-auth.sh

                  if [ -n "${HARBOR_HOST:-}" ] && [ -n "${HARBOR_USERNAME:-}" ] && [ -n "${HARBOR_PASSWORD:-}" ]; then
                    export KSBH_RELEASE_IMAGE_CACHE_REPO="${HARBOR_HOST}/registry/ksbh-release-buildcache"
                    export KSBH_E2E_WEBSOCKET_CACHE_REPO="${HARBOR_HOST}/registry/ksbh-e2e-websocket-probe-buildcache"
                  fi
                  bash mise-tasks/e2e

    publish-images:
        needs:
            - test-binary
            - test-modules
            - test-miri
            - test-k8s
        if: ${{ forge.event_name != 'pull_request' }}
        runs-on: cocaine
        container:
            image: ${{ vars.CI_BASE_IMAGE }}
            credentials:
                username: ${{ secrets.HARBOR_USERNAME }}
                password: ${{ secrets.HARBOR_PASSWORD }}
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: https://data.forgejo.org/actions/checkout@v4

            - name: Build and push release/docs/charts images
              shell: bash
              env:
                  HARBOR_HOST: ${{ vars.HARBOR_HOST }}
                  HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
                  HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
                  DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
              run: |
                  set -euo pipefail
                  . ./scripts/ci/prepare-docker-auth.sh

                  cargo_version="$(grep -m1 '^version = "' crates/ksbh-bin/Cargo.toml | sed -E 's/^version = "([^"]+)"$/\1/')"
                  extra_tag=""
                  case "${LOCAL_REF_NAME}" in
                    dev)
                      primary_tag="$(printf '%s' "${LOCAL_SHA}" | cut -c1-12)-$(date -u +%Y%m%d%H%M%S)"
                      extra_tag="latest-dev"
                      ;;
                    v*)
                      primary_tag="${LOCAL_REF_NAME#v}"
                      if [ "${primary_tag}" != "${cargo_version}" ]; then
                        echo "release tag ${LOCAL_REF_NAME} does not match Cargo version ${cargo_version}" >&2
                        exit 1
                      fi
                      ;;
                    *)
                      echo "no image publish for ref '${LOCAL_REF_NAME}'"
                      exit 0
                      ;;
                  esac

                  if [ -z "${HARBOR_HOST:-}" ]; then
                    echo "HARBOR_HOST is required to publish docs and charts images" >&2
                    exit 1
                  fi
                  if [ -z "${HARBOR_USERNAME:-}" ] || [ -z "${HARBOR_PASSWORD:-}" ]; then
                    echo "HARBOR_USERNAME and HARBOR_PASSWORD are required to publish docs and charts images" >&2
                    exit 1
                  fi
                  if [ -z "${DOCKERHUB_REPOSITORY:-}" ] && [ -z "${DOCKERHUB_USERNAME:-}" ]; then
                    echo "DOCKERHUB_REPOSITORY or DOCKERHUB_USERNAME is required to publish the release image" >&2
                    exit 1
                  fi
                  if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
                    echo "${DOCKERHUB_TOKEN}" | docker login --username "${DOCKERHUB_USERNAME}" --password-stdin
                  elif [ -n "${DOCKERHUB_USERNAME:-}" ] || [ -n "${DOCKERHUB_TOKEN:-}" ]; then
                    echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be set together" >&2
                    exit 1
                  fi

                  image_repository="${DOCKERHUB_REPOSITORY:-${DOCKERHUB_USERNAME}/ksbh}"
                  docs_image_repository="${HARBOR_HOST}/registry/ksbh-docs"
                  charts_image_repository="${HARBOR_HOST}/registry/ksbh-charts"

                  if [ -n "${HARBOR_HOST:-}" ] && [ -n "${HARBOR_USERNAME:-}" ] && [ -n "${HARBOR_PASSWORD:-}" ]; then
                    export KSBH_RELEASE_IMAGE_CACHE_REPO="${HARBOR_HOST}/registry/ksbh-release-buildcache"
                    export KSBH_DOCS_SITE_CACHE_REPO="${HARBOR_HOST}/registry/ksbh-docs-buildcache"
                    export KSBH_CHARTS_SITE_CACHE_REPO="${HARBOR_HOST}/registry/ksbh-charts-buildcache"
                  fi

                  export KSBH_DOCS_SITE_IMAGE="${docs_image_repository}:${primary_tag}"
                  export KSBH_DOCS_SITE_PUSH="true"
                  export KSBH_DOCS_SITE_LOAD="false"

                  export KSBH_CHARTS_SITE_IMAGE="${charts_image_repository}:${primary_tag}"
                  export KSBH_CHARTS_SITE_PUSH="true"
                  export KSBH_CHARTS_SITE_LOAD="false"

                  # Consume the release image built and pushed by test-k8s (avoids a duplicate build).
                  harbor_e2e_image="${HARBOR_HOST}/registry/ksbh-release-buildcache-e2e:${LOCAL_SHA}"
                  if ! docker pull "${harbor_e2e_image}"; then
                    echo "failed to pull release image from Harbor: ${harbor_e2e_image}" >&2
                    exit 1
                  fi
                  docker tag "${harbor_e2e_image}" "${image_repository}:${primary_tag}"
                  docker push "${image_repository}:${primary_tag}"

                  bash mise-tasks/build-docs-site
                  bash mise-tasks/build-docs-site-image
                  bash mise-tasks/build-helm-repo
                  bash mise-tasks/build-charts-site-image

                  if [ -n "${extra_tag}" ]; then
                    docker buildx imagetools create -t "${image_repository}:${extra_tag}" "${image_repository}:${primary_tag}"
                    docker buildx imagetools create -t "${docs_image_repository}:${extra_tag}" "${docs_image_repository}:${primary_tag}"
                    docker buildx imagetools create -t "${charts_image_repository}:${extra_tag}" "${charts_image_repository}:${primary_tag}"
                  fi

    helm-artifacts:
        runs-on: cocaine
        container:
            image: ${{ vars.CI_BASE_IMAGE }}
            credentials:
                username: ${{ secrets.HARBOR_USERNAME }}
                password: ${{ secrets.HARBOR_PASSWORD }}
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: https://data.forgejo.org/actions/checkout@v4

            - name: Lint and package Helm chart
              shell: bash
              run: |
                  set -euo pipefail
                  bash mise-tasks/lint-helm-chart
                  bash mise-tasks/package-helm-chart

            - name: Upload Helm chart artifact
              uses: https://data.forgejo.org/actions/upload-artifact@v4
              with:
                  name: ksbh-helm-chart-${{ forge.ref_name }}
                  path: dist/helm/*.tar.gz
                  if-no-files-found: error
