[package]
name = "ksbh-bench"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ksbh-bench"
path = "src/bin/ksbh-bench.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "process", "signal"] }
reqwest = { workspace = true }
testcontainers = { workspace = true }
ctrlc = "3.4"
rcgen = "0.13"
