[changelog]
header = "# Changelog\n"
body = """
{% if version %}\
    {% if version is matching(pattern="-rc\\.") %}## Pre-release: [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% endif %}\
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | filter(attribute="merge_commit", value=false) | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first | split(pat="\n") | first | trim_end }} ([{{ commit.id | truncate(length=7, end="") }}]({{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = false
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+(-rc\\.[0-9]+)?$"
sort_commits = "oldest"

[[changelog.commit_parsers]]
message = "^feat"
group = "Features"

[[changelog.commit_parsers]]
message = "^fix"
group = "Bug Fixes"

[[changelog.commit_parsers]]
message = "^update"
group = "Updates"

[[changelog.commit_parsers]]
message = "^add"
group = "Additions"

[[changelog.commit_parsers]]
message = "^refactor|^rework"
group = "Refactoring"

[[changelog.commit_parsers]]
message = "^cleanup"
group = "Cleanup"

[[changelog.commit_parsers]]
message = "^chore"
group = "Miscellaneous"

[[changelog.commit_parsers]]
message = "^ci"
group = "CI"

[[changelog.commit_parsers]]
message = "^test"
group = "Testing"

[[changelog.commit_parsers]]
message = ".*"
group = "Other"
